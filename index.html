<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四年级科学 人类的呼吸</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef7ff;color:#183b55;font-family:system-ui,sans-serif;text-align:center}main{max-width:520px;margin:auto;padding:16px}h1{font-size:26px}svg{width:100%;max-width:350px}button{font: bold 23px system-ui;border:0;border-radius:12px;padding:15px;background:#1767ad;color:white;cursor:pointer;flex:1}button:focus-visible{outline:3px solid #333} .row{display:flex;gap:12px;margin:12px 0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.facts div{background:white;border:1px solid #b8d6ec;border-radius:10px;padding:12px;font-size:23px}small{display:block;font-size:15px}#lungs,#ribs,#dia{transition:transform 1.5s ease;transform-box:fill-box;transform-origin:center}.in #lungs{transform:scale(1.2,1.15)}.in #ribs{transform:scale(1.12,1.06)}.in #dia{transform:translateY(20px) scaleY(.35)}.out #lungs{transform:scale(.9,.88)}.out #ribs{transform:scale(.95)}.out #dia{transform:translateY(-7px)}#ai,#ao{opacity:0}.in #ai,.out #ao{opacity:1}.flow{stroke-dasharray:9 7;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-32}}section{background:white;padding:16px;border-radius:14px;margin-top:20px}#feedback{min-height:30px} </style><main><h1>四年级科学 · 人类的呼吸</h1><h2 id="state">请选择吸气或呼气</h2><svg id="model" viewBox="0 0 340 330" role="img" aria-label="呼吸动态示意图"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#1767ad"/></marker></defs><path d="M135 93L135 111Q78 116 65 153L60 293Q170 320 280 293L275 153Q262 116 204 111L204 85Q217 68 211 40Q202 10 169 12Q130 10 120 42L107 56L120 61L120 80Q122 91 135 93Z" fill="#f3e0ce" stroke="#8b796b" stroke-width="2"/><g id="lungs" fill="#8dc5d9" stroke="#367e9f" stroke-width="2.5"><path d="M153 139Q128 120 106 150Q83 185 94 232Q110 253 154 239Q163 213 159 177Z"/><path d="M187 139Q212 120 234 150Q257 185 246 232Q230 253 186 239Q177 213 181 177Z"/></g><path d="M120 53L153 53Q170 53 170 76L170 151M170 145L125 177M170 145L215 177" stroke="#9db8c9" stroke-width="12" fill="none" stroke-linecap="round"/><g id="ribs" fill="none" stroke="#9b8c7d" stroke-width="3" opacity=".65"><path d="M89 145Q170 177 251 145M82 165Q170 197 258 165M80 186Q170 218 260 186M80 207Q170 239 260 207M85 228Q170 260 255 228"/></g><path id="dia" d="M84 268Q170 211 256 268" fill="none" stroke="#8064ae" stroke-width="8" stroke-linecap="round"/><g id="ai" fill="none" stroke="#1767ad" stroke-width="4" marker-end="url(#arrow)"><path class="flow" d="M20 53L150 53Q170 53 170 77L170 135"/><path d="M77 193L36 193"/><path d="M263 193L304 193"/><path d="M170 275L170 310"/></g><g id="ao" fill="none" stroke="#1767ad" stroke-width="4" marker-end="url(#arrow)"><path class="flow" d="M170 135L170 77Q170 53 150 53L20 53"/><path d="M36 193L77 193"/><path d="M304 193L263 193"/><path d="M170 310L170 267"/></g><g font-size="19" fill="#174e69"><text x="120" y="210">肺</text><text x="210" y="210">肺</text><text x="270" y="278">膈</text><text x="183" y="110">气管</text></g></svg><div class="row"><button onclick="breathe(true)">吸气<br><small>xī qì</small></button><button style="background:#087e79" onclick="breathe(false)">呼气<br><small>hū qì</small></button></div><div class="facts" aria-live="polite"><div><small>空气</small><b id="air">—</b></div><div><small>肺</small><b id="lung">—</b></div><div><small>胸腔</small><b id="chest">—</b></div><div><small>膈</small><b id="d">—</b></div></div><section><h2>看图练习</h2><p id="progress"></p><h2 id="question"></h2><div class="row" id="choices"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>下一题</button><button id="retry" hidden>错题重练</button><button onclick="start()">重新练习</button></section><p>简化科学示意图 · 无倒计时</p></main><script>
const $=id=>document.getElementById(id);function breathe(v){$('model').setAttribute('class',v?'in':'out');$('state').textContent=v?'吸气 xī qì':'呼气 hū qì';$('air').textContent=v?'进入':'出去';$('lung').textContent=v?'变大':'变小';$('chest').textContent=v?'扩张':'收缩';$('d').textContent=v?'下降 ↓':'上升 ↑'}
const qs=[[true,'这是吸气还是呼气？','吸气','呼气',0],[false,'这是吸气还是呼气？','吸气','呼气',1],[true,'空气往哪里去？','进入身体','离开身体',0],[false,'空气往哪里去？','进入身体','离开身体',1],[true,'胸腔有什么变化？','收缩','扩张',1],[false,'胸腔有什么变化？','收缩','扩张',0],[true,'膈往哪里移动？','下降','上升',0],[false,'膈往哪里移动？','下降','上升',1],[true,'空气最后进入哪里？','胃','肺',1],[false,'肺有什么变化？','变小','变大',0]];let order,n,score,wrong;function start(items=qs){order=items.slice();n=0;score=0;wrong=[];$('retry').hidden=true;show()}function show(){$('next').hidden=true;$('choices').replaceChildren();$('feedback').textContent='';if(n===order.length){$('progress').textContent='完成！';$('question').textContent=score+' / '+order.length+' 分';$('retry').hidden=!wrong.length;return}let q=order[n];breathe(q[0]);$('progress').textContent='第 '+(n+1)+' / '+order.length+' 题';$('question').textContent=q[1];[q[2],q[3]].forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{Array.from($('choices').children).forEach(x=>x.disabled=true);if(i===q[4]){score++;$('feedback').textContent='答对了！'}else{wrong.push(q);$('feedback').textContent='正确答案：'+q[2+q[4]]} $('next').hidden=false};$('choices').append(b)})}$('next').onclick=()=>{n++;show()};$('retry').onclick=()=>start(wrong);start();$('model').setAttribute('class','');$('state').textContent='请选择吸气或呼气';['air','lung','chest','d'].forEach(id=>$(id).textContent='—');
</script></html>
