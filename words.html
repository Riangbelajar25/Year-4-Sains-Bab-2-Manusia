<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>科学认字游戏</title><style>body{font-family:system-ui;background:#eef7ff;color:#183b55;text-align:center;margin:auto;max-width:540px;padding:14px}button,a{font: bold 19px system-ui;padding:12px;margin:5px;border:0;border-radius:10px;background:#1767ad;color:white;display:inline-block;text-decoration:none}button:disabled{opacity:.55}article{background:white;border-radius:15px;padding:18px;margin:12px 0}#word{font-size:38px}#pic{height:155px;display:grid;place-items:center}svg{width:220px;height:150px} .play{animation:move 1.4s ease-in-out 2}@keyframes move{50%{transform:translateY(-12px)}}@keyframes expand{50%{transform:scale(1.25)}}@keyframes shrink{50%{transform:scale(.65)}}@keyframes down{50%{transform:translateY(25px)}}@keyframes up{50%{transform:translateY(-25px)}}@keyframes shake{25%,75%{transform:translateX(8px)}50%{transform:translateX(-8px)}}#status{min-height:28px} </style><h1>四年级科学 · 人类</h1><a href="index.html">动态呼吸实验</a><div id="groups"></div><div id="levels"></div><article><p id="progress"></p><div id="pic"></div><h2 id="word"></h2><p id="pinyin"></p><h3 id="meaning"></h3><div id="choices"></div><p id="status" aria-live="polite"></p><button id="play">播放示范</button><button id="next">下一题</button><button id="retry" hidden>错题重练</button></article><script>const D=[["吸气","xī qì","空气进入肺","🫁"],["呼气","hū qì","空气离开肺","🫁"],["胸腔","xiōng qiāng","胸部里面容纳肺的空间","🫁"],["膈","gé","肺下方帮助呼吸的肌肉","🫁"],["扩张","kuò zhāng","空间变大","↔️"],["收缩","shōu suō","空间变小","➡️⬅️"],["氧气","yǎng qì","身体需要的气体","O₂"],["二氧化碳","èr yǎng huà tàn","身体产生并呼出的气体","CO₂"],["肺泡","fèi pào","肺里交换气体的小气囊","🫧"],["血管","xuè guǎn","血液流过的管道","🩸"],["上升","shàng shēng","向上移动","⬆️"],["下降","xià jiàng","向下移动","⬇️"],["排遗","pái yí","排出未消化的食物残渣","🚽"],["排泄","pái xiè","排出身体代谢产生的废物","💧"],["粪便","fèn biàn","排遗时排出的物质","💩"],["皮肤","pí fū","覆盖身体表面，可以排出汗液","✋"],["肾","shèn","过滤血液并形成尿液的器官","肾"],["尿液","niào yè","肾形成的液体废物","💧"],["刺激","cì jī","引起身体反应的变化","🔔"],["反应","fǎn yìng","身体受到刺激后的变化","⚡"],["发抖","fā dǒu","身体因寒冷而颤动","🥶"],["闭眼","bì yǎn","把眼睛闭起来","😌"],["缩手","suō shǒu","把手迅速收回来","✋"],["口水","kǒu shuǐ","口腔分泌的唾液","💧"]];const $=x=>document.getElementById(x);let g=0,l=0,n=0,order=[],wrong=[],score=0;const names=['呼吸动作','气体与变化','排遗与排泄','刺激与反应'];function buttons(el,arr,fn){$(el).replaceChildren();arr.forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>fn(i);$(el).append(b)})}function start(items){order=items||Array.from({length:6},(_,i)=>g*6+i);if(l>1&&!items)order=order.slice().sort(()=>Math.random()-.5);n=0;wrong=[];score=0;show()}function picture(i){let s=D[i][3];if(i<4){return '<svg viewBox="0 0 220 150"><path d="M45 25Q110 0 175 25L185 130H35Z" fill="#e4edf5" stroke="#7796aa"/><g id="motion" style="transform-origin:center"><ellipse cx="79" cy="76" rx="32" ry="44" fill="#8dc5d9"/><ellipse cx="141" cy="76" rx="32" ry="44" fill="#8dc5d9"/></g><path d="M110 8V55L79 75M110 55L141 75" stroke="#547c99" stroke-width="8" fill="none"/><path id="di" d="M48 128Q110 91 172 128" stroke="#8064ae" stroke-width="7" fill="none"/>'+(i===0||i===1?'<text x="126" y="24" font-size="24">'+(i===0?'↓':'↑')+'</text>':'')+'</svg>'}if(i===14||i===16||i===8||i===9){let shape=i===14?'<path d="M70 125Q35 110 70 90Q45 70 88 65Q70 45 110 38Q150 55 133 73Q180 85 150 105Q180 125 145 132Z" fill="#986749"/>':i===16?'<path d="M80 30C15 15 20 130 75 125Q110 115 85 85Q65 70 90 50Z M140 30C205 15 200 130 145 125Q110 115 135 85Q155 70 130 50Z" fill="#a65b73"/><path d="M80 85L105 140M140 85L115 140" stroke="#ba9d85" stroke-width="5"/>':i===8?'<g fill="#9acbe1" stroke="#4d8baa"><circle cx="80" cy="55" r="25"/><circle cx="125" cy="55" r="25"/><circle cx="102" cy="95" r="25"/><circle cx="145" cy="95" r="20"/></g><path d="M30 115Q110 150 190 115" stroke="#b54e65" stroke-width="8" fill="none"/>':'<path d="M15 55Q110 15 205 55L205 100Q110 60 15 100Z" fill="#c96b7a"/><g fill="#fff0ef"><ellipse cx="55" cy="66" rx="12" ry="6"/><ellipse cx="110" cy="55" rx="12" ry="6"/><ellipse cx="165" cy="66" rx="12" ry="6"/></g>';return '<svg viewBox="0 0 220 150"><g id="motion" style="transform-origin:center">'+shape+'</g></svg>'}return '<span id="motion" style="font-size:70px;display:inline-block">'+s+'</span>'}function animate(){let i=order[n],m=$('motion');if(!m)return;let a=[0,4].includes(i)?'expand':[1,5,22].includes(i)?'shrink':i===11?'down':i===10?'up':i===20?'shake':'move';m.style.animation='none';void m.getBoundingClientRect();m.style.animation=a+' 1.4s ease-in-out 2';if(i<2){let d=$('di');d.style.transformOrigin='center';d.style.animation=i===0?'down 1.4s ease-in-out 2':'up 1.4s ease-in-out 2'}}function show(){$('status').textContent='';$('choices').replaceChildren();$('retry').hidden=true;$('next').hidden=l>1;$('play').hidden=l!==1;if(n>=order.length){$('progress').textContent='完成';$('pic').innerHTML='';$('word').textContent=l>1?score+' / '+order.length+' 分':'学习完成！';$('pinyin').textContent='';$('meaning').textContent='';$('next').hidden=true;$('play').hidden=true;$('retry').hidden=!wrong.length;return}let i=order[n],d=D[i];$('progress').textContent='第 '+(g+2)+' 组 · Level '+(l+1)+' · '+(n+1)+' / '+order.length;$('pic').innerHTML=l===3?'':picture(i);$('word').textContent=l<2||l===3?d[0]:'请选择正确词语';$('pinyin').textContent=l<2?d[1]:'';$('meaning').textContent=l<2?d[2]:l===3?'这个词是什么意思？':d[2];if(l>1){let opts=[i,...Array.from({length:6},(_,k)=>g*6+k).filter(k=>k!==i).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);buttons('choices',opts.map(k=>D[k][l===2?0:2]),k=>{Array.from($('choices').children).forEach(b=>b.disabled=true);if(opts[k]===i){score++;$('status').textContent='答对了！'}else{wrong.push(i);$('status').textContent='正确答案：'+d[l===2?0:2]}$('next').hidden=false})}}buttons('groups',names.map((x,i)=>'第'+(i+2)+'组 '+x),i=>{g=i;start()});buttons('levels',['1 看图认字','2 动态示范','3 看图选字','4 词义练习'],i=>{l=i;start()});$('play').onclick=animate;$('next').onclick=()=>{n++;show()};$('retry').onclick=()=>start(wrong.slice());start();</script></html>
