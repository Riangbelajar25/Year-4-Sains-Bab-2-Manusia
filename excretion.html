<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排泄和排遗</title><style>*{box-sizing:border-box}body{background:#eef7ff;color:#183b55;font:20px system-ui;text-align:center;margin:0}main{max-width:520px;margin:auto;padding:16px}button,a{display:inline-block;border:0;border-radius:12px;background:#1767ad;color:white;padding:14px;margin:5px;font:bold 22px system-ui;text-decoration:none;cursor:pointer}section{background:white;border-radius:16px;padding:16px;margin:12px 0}svg{width:100%;max-width:300px;height:190px}.flow{animation:move 1.5s infinite}@keyframes move{from{transform:translateY(-18px);opacity:.2}to{transform:translateY(25px);opacity:1}}#feedback{min-height:32px}small{display:block}button:disabled{opacity:.65}</style><main><a href="index.html">返回呼吸游戏</a><h1>排泄和排遗</h1><button onclick="learn()">认识过程</button><button onclick="compare()">分辨排泄与排遗</button><button onclick="start()">10题挑战</button><section id="panel"></section></main><script>const d=[["呼气","肺","水分和二氧化碳","🫁","💨"],["排汗","皮肤","汗液","✋","💧"],["排尿","肾","尿液","肾","💧"],["排遗","肛门","粪便","消化道","💩"]],p=document.getElementById('panel');let current=0;function picture(i){let shapes=['<path d="M145 20V75M145 65L100 95M145 65L190 95" stroke="#739db5" stroke-width="12" fill="none"/><path d="M130 70Q80 35 55 115Q35 170 125 160Z M160 70Q210 35 235 115Q255 170 165 160Z" fill="#91c9e3" stroke="#367e9f" stroke-width="3"/>','<rect x="40" y="55" width="210" height="90" rx="12" fill="#e7b99b"/><path d="M140 55V115q-35 30 0 30t0-30" fill="none" stroke="#1767ad" stroke-width="5"/><path d="M85 55L75 20M200 55L210 20" stroke="#745848" stroke-width="4"/>','<path d="M100 40C30 20 30 145 95 130Q135 115 100 90Q135 60 100 40M190 40C260 20 260 145 195 130Q155 115 190 90Q155 60 190 40" fill="#bd7979" stroke="#8c5050" stroke-width="3"/><path d="M100 100Q110 160 145 165Q180 160 190 100" fill="none" stroke="#b89068" stroke-width="6"/>','<rect x="65" y="25" width="160" height="125" rx="35" fill="none" stroke="#c58b70" stroke-width="22"/><path d="M100 65H190V95H100V120H145V180" fill="none" stroke="#d8a48a" stroke-width="15"/>'];return '<svg viewBox="0 0 290 220" role="img" aria-label="'+d[i][1]+'示意图">'+shapes[i]+'<text class="flow" x="145" y="'+(i===1?35:185)+'" text-anchor="middle" font-size="24">'+d[i][4]+'</text></svg>'}function learn(i=0){current=i;p.innerHTML='<h2>第一关 · 认识过程</h2>'+d.map((x,j)=>'<button onclick="learn('+j+')">'+x[0]+'</button>').join('')+picture(i)+'<h2>'+d[i][0]+'</h2><h3>'+d[i][1]+' → '+d[i][2]+'</h3><p>'+ (i===3?'排遗：排出无法消化的食物残渣。':'排泄：把身体产生的废物排出体外。')+'</p>'}function compare(){p.innerHTML='<h2>第二关 · 分辨</h2><button onclick="detail(0)">排泄</button><button onclick="detail(1)">排遗</button><div id="detail">请选择</div>'}function detail(i){document.getElementById('detail').innerHTML=i?picture(3)+'<h2>排遗</h2>肛门 → 粪便': '<h2>排泄</h2>'+d.slice(0,3).map(x=>'<p>'+x[0]+' → '+x[1]+' → '+x[2]+'</p>').join('')}const qs=[[0,'这是哪个排泄器官？',['肺','皮肤','肾'],0],[1,'这是哪个排泄器官？',['肺','皮肤','肾'],1],[2,'这是哪个排泄器官？',['肺','皮肤','肾'],2],[0,'肺排出什么？',['尿液','水分和二氧化碳','汗液'],1],[1,'皮肤排出什么？',['汗液','粪便','尿液'],0],[2,'肾排出什么？',['汗液','尿液','粪便'],1],[0,'肺涉及哪个排泄过程？',['排尿','呼气','排汗'],1],[1,'皮肤涉及哪个排泄过程？',['排汗','呼气','排尿'],0],[2,'肾涉及哪个排泄过程？',['呼气','排汗','排尿'],2],[3,'排出粪便属于什么过程？',['排泄','排遗'],1]];let order,n,score,wrong;function start(a=qs){order=[...a].sort(()=>Math.random()-.5);n=score=0;wrong=[];show()}function show(){if(n===order.length){p.innerHTML='<h2>完成！ '+score+'/'+order.length+'</h2><button onclick="start()">再玩一次</button>'+(wrong.length?'<button onclick="start(wrong)">错题重练</button>':'');return}let q=order[n];p.innerHTML='<small>第 '+(n+1)+' / '+order.length+' 题</small>'+picture(q[0])+'<h2>'+q[1]+'</h2>'+q[2].map((x,i)=>'<button class="choice" onclick="answer('+i+')">'+x+'</button>').join('')+'<p id="feedback"></p><button id="next" hidden onclick="n++;show()">下一题</button>'}function answer(i){let q=order[n];document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(i===q[3]){score++;document.getElementById('feedback').textContent='答对了！'}else{wrong.push(q);document.getElementById('feedback').textContent='正确答案：'+q[2][q[3]]}document.getElementById('next').hidden=false}learn();</script></html>
